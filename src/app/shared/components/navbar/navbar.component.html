<nav class="navbar" *ngIf="authService.isLoggedIn()">
  <div class="navbar-left">
    <a routerLink="/">🏠 Home</a>
  </div>
  <div class="navbar-right">
    <span class="username">👤 {{ authService.getUsername() }}</span>
    <button class="logout-btn" (click)="openLogoutModal()">Logout 🔒</button>
  </div>
</nav>

<!-- Logout Confirmation Modal -->
<div class="modal-backdrop" *ngIf="showLogoutModal">
  <div class="modal-content">
    <p>Are you sure you want to logout?</p>
    <div class="modal-actions">
      <button class="delete-btn" (click)="confirmLogout()">Yes, Logout 🔒</button>
      <button class="cancel-btn" (click)="cancelLogout()">Cancel ❌</button>
    </div>
  </div>
</div>
